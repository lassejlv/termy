[package]
name = "termy_cli"
version = "0.2.70"
edition = "2024"
default-run = "termy-cli"

[lints]
workspace = true

[[bin]]
name = "termy-cli"
path = "src/main.rs"

[[bin]]
name = "xtask"
path = "src/xtask/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { version = "4", features = ["derive"] }
notify = "8"
ratatui = "0.29"
crossterm = "0.28"
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
ureq = { workspace = true }
url = { workspace = true }
percent-encoding = "2.3"
alacritty_terminal = { workspace = true }
roxmltree = "0.20"
termy_core = { path = "../core" }


[target."cfg(target_os = \"macos\")".dependencies]
core-text = "=21.0.0"
core-foundation = "0.10"

[features]
benchmark-allocations = []
