# fly.toml app configuration file generated for termy on 2026-11-11T08:57:05Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = "termy"
primary_region = 'arn'

[build]
  dockerfile = "crates/relay/Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "8080"
  RUST_LOG = "info,sqlx=warn"

[http_service]
  internal_port = 8080
  force_https = true
  # Long-lived WebSocket connections are held in memory; don't stop the machine.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  checks = [{ grace_period = '30s', interval = '15s', method = 'GET', path = '/health', timeout = '5s' }]
  concurrency = { hard_limit = 2000, soft_limit = 1000, type = 'connections' }

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
  processes = ['app']
