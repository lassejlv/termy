[package]
name = "termy"
default-run = "termy"
version = "0.2.75"
edition = "2024"

[package.metadata]

[package.metadata.bundle]
name = "Termy"
identifier = "com.lassevestergaard.termy"
short_description = "Minimal GPUI-powered terminal"
category = "Developer Tool"
icon = ["../../assets/termy.icns"]

[lints]
workspace = true

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
gpui = { workspace = true }
alacritty_terminal = { workspace = true }
flume = { workspace = true }
smol = "2.0"
anyhow = { workspace = true }
dirs = { workspace = true }
log = { workspace = true }
env_logger = "0.11"
rfd = "0.15"
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
p256 = { workspace = true }
rand_core = { workspace = true }
bincode = "1.3"
url = { workspace = true }
tempfile = { workspace = true }
fs4 = { version = "0.13.1", features = ["sync"] }
notify = "8"
ureq = { workspace = true }
webbrowser = "1.0"
sysinfo = "0.37"
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
tokio = { version = "1", default-features = false, features = ["rt"] }
sha2 = { workspace = true }
unicode-width = { workspace = true }
termy_core = { path = "../core" }


[target."cfg(not(target_os = \"windows\"))".dependencies]
libsqlite3-sys = "0.30.1"


[target."cfg(target_os = \"linux\")".dependencies]
font-kit = { package = "zed-font-kit", version = "0.14.1-zed", features = ["source-fontconfig-dlopen"] }


[target."cfg(target_os = \"macos\")".dependencies]
core-text = "=21.0.0"
core-foundation = "0.10"
cocoa = "=0.26.0"
objc = "0.2"
raw-window-handle = "0.6"
dispatch2 = "0.3.0"
objc2 = "0.6.3"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSData", "NSDictionary", "NSGeometry", "NSString"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSAccessibility", "NSAlert", "NSApplication", "NSBitmapImageRep", "NSButton", "NSControl", "NSEvent", "NSGraphics", "NSImage", "NSImageRep", "NSMenu", "NSMenuItem", "NSResponder", "NSView", "NSWorkspace"] }
objc2-uniform-type-identifiers = { version = "0.3.2", default-features = false, features = ["UTType"] }


[target."cfg(target_os = \"windows\")".build-dependencies]
winresource = "0.1"

[target."cfg(target_os = \"windows\")".dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }


[target."cfg(any(target_os = \"macos\", target_os = \"linux\", target_os = \"windows\"))".dependencies]
clipboard-rs = { version = "0.3.5", features = ["wayland"] }
url = { workspace = true }

[target."cfg(unix)".dependencies]
rustix-openpty = "0.2"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }
