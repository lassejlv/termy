name: Verify macOS signing credentials

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 10
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      TERMY_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      TERMY_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Import Developer ID and notarization credentials
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
        run: ./scripts/setup-macos-signing.sh

      - name: Verify Developer ID and notary access
        run: |
          security find-identity -v -p codesigning | grep -F "$TERMY_SIGN_IDENTITY"
          xcrun notarytool history \
            --key "$TERMY_NOTARY_KEY" \
            --key-id "$TERMY_NOTARY_KEY_ID" \
            --issuer "$TERMY_NOTARY_ISSUER" \
            --output-format json >/dev/null

      - name: Remove signing credentials
        if: always()
        run: |
          if [[ -n "${TERMY_SIGNING_DIR:-}" && -d "$TERMY_SIGNING_DIR" ]]; then
            security delete-keychain "$TERMY_SIGNING_DIR/signing.keychain-db" || true
            rm -rf "$TERMY_SIGNING_DIR"
          fi
