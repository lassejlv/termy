[package]
name = "termy"
version = "0.2.70"
edition = "2024"

[package.metadata.bundle]
name = "Termy"
identifier = "com.lassevestergaard.termy"
short_description = "Minimal GPUI-powered terminal"
category = "Developer Tool"
icon = ["../../assets/termy.icns"]

[lints]
workspace = true

[dependencies]
image = { version = "0.25", default-features = false }
gpui = { workspace = true }

# Terminal emulation
alacritty_terminal = { workspace = true }

# Async/concurrency
flume = { workspace = true }
smol = "2.0"
anyhow = { workspace = true }
dirs = { workspace = true }

# Logging
log = { workspace = true }
env_logger = "0.11"

# File dialogs
rfd = "0.15"

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
p256 = { workspace = true }
rand_core = { workspace = true }
bincode = "1.3"
url = { workspace = true }

# File I/O
tempfile = { workspace = true }
fs4 = { version = "0.13.1", features = ["sync"] }
notify = "8"
ureq = { workspace = true }
webbrowser = "1.0"
sysinfo = "0.37"

# Termy Workspace Crates
termy_auto_update = { path = "../auto_update" }
termy_core = { path = "../core" }
termy_themes = { path = "../themes" }
termy_terminal_ui = { path = "../terminal_ui" }
termy_ui = { path = "../ui" }
termy_search = { path = "../search" }
termy_ssh_core = { path = "../ssh_core" }
termy_native_sdk = { path = "../native_sdk" }
termy_config_core = { path = "../config_core" }
termy_command_core = { path = "../command_core" }
termy_cli_install_core = { path = "../cli_install_core" }
termy_plugin_runtime = { path = "../plugin_runtime" }
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
tokio = { version = "1", default-features = false, features = ["rt"] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
libsqlite3-sys = "0.30.1"

[target.'cfg(target_os = "linux")'.dependencies]
raw-window-handle = "0.6"
x11rb = "0.13.2"
font-kit = { package = "zed-font-kit", version = "0.14.1-zed", features = ["source-fontconfig-dlopen"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Pin core-text to 21.0.0 to avoid core-graphics version conflict on macOS.
core-text = "=21.0.0"
core-foundation = "0.10"
cocoa = "=0.26.0"
objc = "0.2"
raw-window-handle = "0.6"

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
raw-window-handle = "0.6"
x11rb = "0.13.2"
gpui = { workspace = true, features = ["test-support"] }
