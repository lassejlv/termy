# fly.toml app configuration file generated for termy on 2026-11-11T08:48:09Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'termy'
primary_region = 'arn'

[build]
  dockerfile = 'crates/relay/Dockerfile'

[env]
  HOST = '0.0.0.0'
  PORT = '8080'
  RUST_LOG = 'info,sqlx=warn'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 2000
    soft_limit = 1000

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
