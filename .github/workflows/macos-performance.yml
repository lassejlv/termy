name: macOS Performance Gates

on:
  pull_request:
    paths:
      - "crates/**"
      - "macos/**"
      - "assets/**"
      - ".github/workflows/macos-performance.yml"
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: "Git ref used as the benchmark baseline"
        required: false
        default: "main"
      duration_secs:
        description: "Seconds per benchmark scenario"
        required: false
        default: "13"

permissions:
  contents: read

concurrency:
  group: macos-performance-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  performance:
    name: Benchmark and gate (${{ matrix.scenario }})
    runs-on: macos-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - idle-blink
          - idle-burst
          - echo-train
          - steady-scroll
          - alt-screen-anim
    env:
      DURATION_SECS: ${{ github.event_name == 'workflow_dispatch' && inputs.duration_secs || '13' }}
    steps:
      - name: Checkout baseline
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          path: baseline
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || inputs.baseline_ref || github.event.repository.default_branch }}

      - name: Checkout candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          path: candidate
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            baseline -> target
            candidate -> target

      - name: Run benchmark comparison
        run: |
          cd "$GITHUB_WORKSPACE/candidate"
          cargo run -p xtask -- benchmark-compare \
            --baseline-root "$GITHUB_WORKSPACE/baseline" \
            --candidate-root "$GITHUB_WORKSPACE/candidate" \
            --output "$GITHUB_WORKSPACE/benchmark-output-${{ matrix.scenario }}" \
            --duration-secs "$DURATION_SECS" \
            --scenario "${{ matrix.scenario }}"

      - name: Check performance gates
        run: |
          "$GITHUB_WORKSPACE/candidate/macos/scripts/check-performance-gates.sh" \
            --summary "$GITHUB_WORKSPACE/benchmark-output-${{ matrix.scenario }}/summary.json"

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-performance-report-${{ matrix.scenario }}
          path: |
            benchmark-output-${{ matrix.scenario }}/report.md
            benchmark-output-${{ matrix.scenario }}/summary.json
            benchmark-output-${{ matrix.scenario }}/raw/**/driver/*.ndjson
            benchmark-output-${{ matrix.scenario }}/raw/**/*-target.log
            benchmark-output-${{ matrix.scenario }}/raw/**/app/summary.json
          if-no-files-found: ignore

  native-performance:
    name: Native performance and GPUI comparison
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DURATION_SECS: ${{ github.event_name == 'workflow_dispatch' && inputs.duration_secs || '13' }}
    steps:
      - name: Checkout baseline
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          path: baseline
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || inputs.baseline_ref || github.event.repository.default_branch }}

      - name: Checkout candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          path: candidate
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Select Xcode with Swift 6.2
        run: |
          xcode_app="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)"
          sudo xcode-select -s "${xcode_app}/Contents/Developer"
          swift --version
          xcrun xctrace version

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            baseline -> target
            candidate -> target

      - name: Build native release candidate
        working-directory: candidate
        run: ./macos/scripts/build-dmg.sh --arch arm64 --no-layout

      - name: Run deterministic render gates and regression fixtures
        working-directory: candidate
        env:
          TERMY_RENDER_REPORT_PATH: ${{ github.workspace }}/native-render-report.json
        run: ./macos/scripts/check-render-perf-regressions.sh

      - name: Measure launch, idle CPU, and pane memory
        working-directory: candidate
        run: |
          ./macos/scripts/check-launch-gate.sh \
            --app macos/.build/dmg-arm64/Termy.app \
            --output "$GITHUB_WORKSPACE/native-launch-report.json"

      - name: Run windowed native versus GPUI comparison
        working-directory: candidate
        run: |
          cargo run -p xtask --release -- benchmark-compare \
            --baseline-root "$GITHUB_WORKSPACE/baseline" \
            --candidate "native:$GITHUB_WORKSPACE/candidate/macos/.build/dmg-arm64/Termy.app" \
            --output "$GITHUB_WORKSPACE/native-benchmark-output" \
            --duration-secs "$DURATION_SECS" \
            --scenario steady-scroll \
            --scenario alt-screen-anim

      - name: Check calibrated native comparison gates
        run: |
          "$GITHUB_WORKSPACE/candidate/macos/scripts/check-performance-gates.sh" \
            --summary "$GITHUB_WORKSPACE/native-benchmark-output/summary.json" \
            --max-cpu-delta-percent 20 \
            --max-memory-delta-mib 90 \
            --max-frame-p95-delta-ms 9 \
            --max-idle-wakeup-delta 500

      - name: Upload native performance reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-native-performance-report
          path: |
            native-render-report.json
            native-launch-report.json
            native-benchmark-output/report.md
            native-benchmark-output/summary.json
            native-benchmark-output/raw/**/driver/*.ndjson
            native-benchmark-output/raw/**/*-target.log
            native-benchmark-output/raw/**/app/summary.json
          if-no-files-found: ignore
          retention-days: 30
