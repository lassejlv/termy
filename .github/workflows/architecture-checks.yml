name: Architecture Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  clippy:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # Windows-only code (updater, ConPTY, registry) is invisible to the macOS
  # run above.
  clippy-windows:
    name: Clippy (windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # Compiles termy.iss for both architectures against placeholder binaries,
  # so installer script errors surface in PRs instead of at release time.
  windows-installer:
    name: Windows installer script
    runs-on: windows-latest
    env:
      INNOSETUP_VERSION: 6.7.1
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Inno Setup
        run: choco install innosetup --version="$env:INNOSETUP_VERSION" --no-progress -y

      - name: Compile termy.iss
        shell: pwsh
        run: |
          $release = "target\iscc-smoke\release"
          New-Item -ItemType Directory -Force -Path $release | Out-Null
          foreach ($name in @("termy.exe", "termy-cli.exe", "Microsoft.UI.Xaml.dll", "resources.pri")) {
            Set-Content -Path (Join-Path $release $name) -Value "placeholder"
          }
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          $output = Join-Path $env:RUNNER_TEMP "iscc-smoke"
          foreach ($arch in @("x64", "arm64")) {
            & $iscc /Q "/O$output" "/DMyAppVersion=0.0.0-smoke" "/DMyOutputVersion=v0.0.0-smoke" "/DMyArch=$arch" "/DMyTarget=iscc-smoke" scripts\installer\termy.iss
            if ($LASTEXITCODE -ne 0) { throw "ISCC failed for $arch with exit code $LASTEXITCODE" }
          }
          Get-ChildItem $output

  boundaries:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install boundary check dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Run boundary checks
        run: ./scripts/check-boundaries.sh

  fmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: rustfmt

      - name: Cache Rust
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Check formatting
        run: cargo fmt --all -- --check


  wasm-check:
    name: Wasm build check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache Rust
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      # Layout asserts and pointer-width assumptions only fail on 32-bit
      # targets; the npm publish job is otherwise the only wasm build.
      - name: Check wasm build
        run: cargo check --locked -p termy_wasm --target wasm32-unknown-unknown

  engine-library:
    name: Engine C library (musl)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl

      - name: Cache Rust
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      # Links and runs a C program against libtermy_engine.a.
      - name: Test engine library
        run: cargo test --locked -p termy_engine_ffi

      - name: Package static library
        run: scripts/package-libtermy-engine.sh x86_64-unknown-linux-musl

  workspace-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            clang \
            pkg-config \
            fonts-dejavu-core \
            libfontconfig-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-x11-dev \
            libssl-dev \
            libzstd-dev \
            libasound2-dev \
            libvulkan1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Setup Bun for plugin runtime tests
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Run workspace tests
        run: cargo test --workspace --release

  core-tests:
    name: Core tests (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            runner: macos-latest
          - os: linux
            runner: ubuntu-24.04
          - os: windows
            runner: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Linux core dependencies
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev fonts-dejavu-core

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Setup Bun for plugin runtime tests
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Run Core tests
        run: cargo test --locked -p termy_core

  desktop-platform-check:
    name: Desktop platform check (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-latest
          - os: linux
            runner: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Linux desktop dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            clang \
            pkg-config \
            libfontconfig-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-x11-dev \
            libssl-dev \
            libzstd-dev \
            libasound2-dev \
            libvulkan1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Setup Bun for plugin runtime tests
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Check desktop platform
        shell: bash
        run: ./scripts/check-platform-builds.sh --native

      - name: Verify initial Windows shell dimensions
        if: matrix.os == 'windows'
        run: cargo test --locked -p termy --bin termy terminal_view::startup_size_tests -- --nocapture

  tmux-integration:
    name: Tmux integration (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            runner: macos-latest
          - os: linux
            runner: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Linux desktop dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libfontconfig-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-x11-dev \
            libssl-dev \
            libzstd-dev \
            libasound2-dev \
            libvulkan1 \
            tmux \
            just

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install macOS tmux + just
        if: matrix.os == 'macos'
        run: brew install tmux just

      - name: Require tmux >= 3.3
        shell: bash
        run: |
          set -euo pipefail
          version="$(tmux -V | awk '{print $2}')"
          major="${version%%.*}"
          minor_part="${version#*.}"
          minor_digits="${minor_part%%[^0-9]*}"
          if [[ -z "${minor_digits}" ]]; then
            minor_digits=0
          fi
          if (( major < 3 )) || (( major == 3 && minor_digits < 3 )); then
            echo "tmux ${version} is below required 3.3" >&2
            exit 1
          fi
          echo "tmux ${version}"

      - name: Run tmux integration tests
        run: just test-tmux-integration
