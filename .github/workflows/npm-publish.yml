name: Publish npm packages

# Manual only: the @termysh/* packages are versioned and released
# independently of the desktop app.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version for all @termysh/* packages (e.g. 0.2.0 or 0.2.0-beta.1)
        required: true
      dist_tag:
        description: npm dist-tag
        required: true
        default: latest
        type: choice
        options: [latest, next, beta]
      dry_run:
        description: Build and pack without publishing
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # npm provenance

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: packages
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache Rust
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install wasm tooling
        working-directory: .
        run: |
          # Must match the wasm-bindgen version pinned in crates/wasm/Cargo.toml.
          cargo install wasm-bindgen-cli --version 0.2.128 --locked
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 install -y binaryen

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test wasm bindings
        working-directory: .
        run: cargo test -p termy_wasm

      - name: Set version
        run: node scripts/set-version.mjs "${{ inputs.version }}"

      - name: Build
        env:
          TERMY_REQUIRE_WASM_OPT: '1'
        run: bun run build

      - name: Typecheck and test
        run: |
          bun run typecheck
          bun run test

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ inputs.dist_tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          flags=(--access public --provenance --tag "$DIST_TAG")
          if [[ "$DRY_RUN" == "true" ]]; then flags+=(--dry-run); fi
          # Dependency order: core, then web, then xterm.
          for pkg in core web xterm; do
            (cd "$pkg" && npm publish "${flags[@]}")
          done
