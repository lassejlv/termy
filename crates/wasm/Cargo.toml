[package]
name = "termy_wasm"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
termy_core = { path = "../core", default-features = false }
# Keep in lockstep with the wasm-bindgen CLI used by packages/core/scripts/build-wasm.mjs.
wasm-bindgen = "=0.2.128"
js-sys = "0.3"
web-time = "1"
serde_json = { workspace = true }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
