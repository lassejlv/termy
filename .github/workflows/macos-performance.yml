name: macOS Performance Gates

on:
  pull_request:
    paths:
      - "crates/**"
      - "assets/**"
      - "scripts/check-performance-gates.sh"
      - ".github/workflows/macos-performance.yml"
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: "Git ref used as the benchmark baseline"
        required: false
        default: "main"
      duration_secs:
        description: "Seconds per benchmark scenario"
        required: false
        default: "13"

permissions:
  contents: read

concurrency:
  group: macos-performance-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  performance:
    name: Benchmark and gate (${{ matrix.scenario }})
    runs-on: macos-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - idle-blink
          - idle-burst
          - echo-train
          - steady-scroll
          # Instruments hangs while finalizing full-screen TUI traces on hosted
          # runners, so keep that scenario out of this workflow.
    env:
      DURATION_SECS: ${{ github.event_name == 'workflow_dispatch' && inputs.duration_secs || '13' }}
    steps:
      - name: Checkout baseline
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          path: baseline
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || inputs.baseline_ref || github.event.repository.default_branch }}

      - name: Checkout candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          path: candidate
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            baseline -> target
            candidate -> target

      - name: Run benchmark comparison
        env:
          TERMY_EXPERIMENTAL_TMON_ENGINE: "0"
        run: |
          cd "$GITHUB_WORKSPACE/candidate"
          cargo run -p termy_cli --bin xtask -- benchmark-compare \
            --baseline-root "$GITHUB_WORKSPACE/baseline" \
            --candidate-root "$GITHUB_WORKSPACE/candidate" \
            --output "$GITHUB_WORKSPACE/benchmark-output-${{ matrix.scenario }}" \
            --duration-secs "$DURATION_SECS" \
            --scenario "${{ matrix.scenario }}" \
            --skip-animation-trace

      - name: Check performance gates
        run: |
          "$GITHUB_WORKSPACE/candidate/scripts/check-performance-gates.sh" \
            --summary "$GITHUB_WORKSPACE/benchmark-output-${{ matrix.scenario }}/summary.json" \
            --max-idle-wakeup-delta 500 \
            --min-displayed-frames 0

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-performance-report-${{ matrix.scenario }}
          path: |
            benchmark-output-${{ matrix.scenario }}/report.md
            benchmark-output-${{ matrix.scenario }}/summary.json
            benchmark-output-${{ matrix.scenario }}/raw/**/driver/*.ndjson
            benchmark-output-${{ matrix.scenario }}/raw/**/*-target.log
            benchmark-output-${{ matrix.scenario }}/raw/**/app/summary.json
          if-no-files-found: ignore
