name: Finalize stable release

on:
  release:
    types: [released]

permissions:
  contents: write
  actions: write

concurrency:
  group: finalize-stable-release-${{ github.event.release.id }}
  cancel-in-progress: false

jobs:
  finalize-stable-release:
    name: Mark release as latest and publish AUR
    if: ${{ github.event.release.prerelease == false && github.event.release.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Wait for required release assets
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const tag = context.payload.release.tag_name;
            const expectedAssets = [
              `Termy-${tag}-linux-x86_64.tar.gz`,
              `Termy-${tag}-macos-arm64-signed.dmg`,
              `Termy-${tag}-macos-x86_64-signed.dmg`,
              `Termy-${tag}-windows-x64-Setup.exe`,
              `Termy-${tag}-windows-arm64-Setup.exe`,
              "checksums.txt"
            ];
            const deadline = Date.now() + 65 * 60 * 1000;

            while (true) {
              const { data: release } = await github.rest.repos.getRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: context.payload.release.id
              });

              const available = new Set(release.assets.map((asset) => asset.name));
              const missing = expectedAssets.filter((asset) => !available.has(asset));
              if (missing.length === 0) {
                core.info("Found Linux, macOS and Windows release assets and checksums");
                break;
              }

              if (Date.now() >= deadline) {
                throw new Error(`Timed out waiting for ${missing.join(", ")}`);
              }

              core.info(`Waiting for ${missing.join(", ")}`);
              await new Promise((resolve) => setTimeout(resolve, 15_000));
            }

      - name: Mark stable release as latest
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: context.payload.release.id,
              prerelease: false,
              make_latest: "true"
            });

      - name: Trigger AUR publish
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const version = context.payload.release.tag_name.replace(/^v/, "");
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "aur-publish.yml",
              ref: "main",
              inputs: { version }
            });

  # Opens a winget-pkgs pull request for the new version. Needs a classic
  # token with public_repo scope for an account that has a fork of
  # microsoft/winget-pkgs; skipped when WINGET_TOKEN is not configured. The
  # first version must be submitted by hand (see packaging/winget).
  publish-winget:
    name: Publish to winget
    needs: finalize-stable-release
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      WINGET_TOKEN_PRESENT: ${{ secrets.WINGET_TOKEN != '' }}
    steps:
      - name: Skip without WINGET_TOKEN
        if: env.WINGET_TOKEN_PRESENT != 'true'
        run: echo "WINGET_TOKEN is not configured; skipping the winget publish."

      - name: Open winget-pkgs pull request
        if: env.WINGET_TOKEN_PRESENT == 'true'
        uses: vedantmgoyal9/winget-releaser@b7370d4d152efdce803a26cc6ca9eee58cb2ad54 # v2
        with:
          identifier: lassejlv.Termy
          installers-regex: '-windows-(x64|arm64)-Setup\.exe$'
          release-tag: ${{ github.event.release.tag_name }}
          token: ${{ secrets.WINGET_TOKEN }}
